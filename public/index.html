<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distriaves · Creación de clientes</title>
<link rel="stylesheet" href="styles.css?v=32">
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-mark">D</div>
      <div>
        <div class="logo-name">Distriaves</div>
        <div class="logo-sub">Creación de clientes</div>
      </div>
    </div>
    <nav class="nav" id="navLateral"></nav>
    <div class="side-footer">
      <p class="side-note">Los documentos se revisan en este navegador y no se guardan en ninguna parte.</p>
      <div class="side-actions">
        <button class="side-btn" onclick="exportar()" id="btnExportar"></button>
        <button class="side-btn" onclick="document.getElementById('inputImportar').click()" id="btnImportar"></button>
      </div>
      <div class="side-usuario">
        <span id="usuarioActivo"></span>
        <span class="side-version num" id="appVersion"></span>
        <button class="side-btn" onclick="salir()" id="btnSalir"></button>
      </div>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <div><h1 id="tituloVista">Verificar un paquete</h1></div>
      <span class="fecha num" id="fechaHoy"></span>
      <div class="top-search" id="barraBusqueda">
        <span id="icoSearch"></span>
        <input id="buscador" placeholder="Buscar cliente o negocio" oninput="onBuscar()">
        <kbd>/</kbd>
      </div>
      <button class="btn btn-primary" onclick="abrirForm()" id="btnNuevo">
        <span id="icoPlus"></span> Nuevo cliente <kbd>N</kbd>
      </button>
    </header>
    <div class="contenido" id="vista"></div>
  </main>
</div>

<nav class="mobile-nav" id="navMovil"></nav>
<div id="zonaModal"></div>
<div id="zonaToast"></div>
<input type="file" id="inputImportar" accept=".json,application/json" style="display:none" onchange="importar(this.files[0])">
<input type="file" id="inputPdf" accept="application/pdf,.pdf" style="display:none">

<script src="rut.js?v=32"></script>
<script src="mapa.js?v=32"></script>
<script src="rejilla.js?v=32"></script>
<script src="casillas.js?v=32"></script>
<script src="ocr.js?v=32"></script>
<script src="verificador.js?v=32"></script>
<script src="reglas.js?v=32"></script>
<script src="verificar-ui.js?v=32"></script>
<script src="vendor/pdf-lib.min.js"></script>
<script src="vendor/fontkit.umd.min.js"></script>
<script src="formulario.js?v=32"></script>
<script src="organizar.js?v=32"></script>
<script src="diligenciar-ui.js?v=32"></script>
<script src="app.js?v=32"></script>
</body>
</html>
